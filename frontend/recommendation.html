<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="MovieAI — Describe what you want and discover personalized Indian movies.">
    <title>MovieAI — Describe What You Want</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="cinema-subpage">
    <nav class="site-nav" aria-label="Main navigation">
        <a class="site-nav-link" href="/" aria-label="Home" title="Home"><span class="material-symbols-rounded" aria-hidden="true">home</span><span class="site-nav-label">Home</span></a>
        <a class="site-nav-link" href="/recommendation.html" aria-label="Natural-language recommendations" title="Describe a movie" aria-current="page"><span class="material-symbols-rounded" aria-hidden="true">auto_awesome</span><span class="site-nav-label">Discover</span></a>
        <a class="site-nav-link" href="/movie-search.html" aria-label="Search movies" title="Search movies"><span class="material-symbols-rounded" aria-hidden="true">search</span><span class="site-nav-label">Search</span></a>
    </nav>
    <div class="ambient ambient-one" aria-hidden="true"></div><div class="ambient ambient-two" aria-hidden="true"></div><div class="ambient ambient-subpage" aria-hidden="true"></div>
    <main class="recommendation-page">
        <header class="recommendation-header">
            <a href="index.html#nextPage" class="recommendation-back" id="backToModesBtn" aria-label="Back to mode selection"><span class="material-symbols-rounded back-arrow-icon" aria-hidden="true">arrow_back</span><span>Back</span></a>
            <div class="recommendation-brand"><span class="brand-text">MOVIE<span class="brand-ai-accent">AI</span></span></div>
        </header>
        <section class="recommendation-main">
            <div class="recommendation-heading"><h1>Describe what you <span class="gradient-text">want.</span></h1><p>Tell MovieAI your mood, favorite stars, genre, or the kind of story you crave today.</p></div>
            <form id="recommendationForm" class="recommendation-form" novalidate>
                <div class="recommendation-search-shell">
                    <span id="recommendationSearchIcon" class="recommendation-search-icon movieai-search-icon" data-movieai-search-icon aria-hidden="true"></span>
                    <input id="recommendationInput" class="recommendation-input" type="text" maxlength="500" autocomplete="off" placeholder="Try: Telugu romantic feel-good movie with great music..." aria-label="Describe what kind of movie you want">
                    <button type="button" id="clearInputBtn" class="clear-btn recommendation-clear-btn" aria-label="Clear movie request" hidden><span class="material-symbols-rounded" aria-hidden="true">close</span></button>
                    <button type="submit" id="recommendationButton" class="recommendation-button" aria-label="Roll the reel and find movies"><span class="button-text">Roll the reel</span><span class="recommendation-button-spinner" aria-hidden="true"></span><span class="material-symbols-rounded button-arrow" aria-hidden="true">arrow_forward</span></button>
                </div>
            </form>
            <div class="recommendation-prompt-chips prompt-chips" role="toolbar" aria-label="Suggested movie prompts">
                <button type="button" class="prompt-chip" data-prompt="I want a Telugu feel-good romantic family entertainer with comedy and great music">Feel-Good Romance</button>
                <button type="button" class="prompt-chip" data-prompt="High-voltage mass action thriller with goosebumps elevation scenes and punch dialogues">Mass Action Thriller</button>
                <button type="button" class="prompt-chip" data-prompt="A gripping murder mystery whodunit with unexpected plot twists and suspense">Suspense Mystery</button>
                <button type="button" class="prompt-chip" data-prompt="Emotional sports underdog drama about dedication, struggle, and triumph">Inspiring Sports Drama</button>
                <button type="button" class="prompt-chip" data-prompt="Epic Indian mythological fantasy with grand visuals, folklore, and heroism">Mythological Epic</button>
                <button type="button" class="prompt-chip" data-prompt="A laugh-out-loud 90s style vintage comedy drama for a lighthearted weekend">Vintage Comedy</button>
            </div>
            <section id="recommendationResults" class="recommendation-results" aria-live="polite" aria-busy="false"></section>
        </section>
    </main>
    <script src="film-reel-loader.js"></script>
    <script src="search-icon.js"></script>
    <script src="empty-state.js"></script>
    <script src="recommendation.js"></script>
</body>
</html>
