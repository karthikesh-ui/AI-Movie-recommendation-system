<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="MovieAI movie details">
    <title>Movie details · MovieAI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="cinema-subpage movie-details-body">
    <nav class="site-nav" aria-label="Main navigation">
        <a class="site-nav-link" href="/" aria-label="Home" title="Home"><span class="material-symbols-rounded" aria-hidden="true">home</span></a>
        <a class="site-nav-link" href="/recommendation.html" aria-label="Natural-language recommendations" title="Describe a movie"><span class="material-symbols-rounded" aria-hidden="true">auto_awesome</span></a>
        <a class="site-nav-link" href="/movie-search.html" aria-label="Search movies" title="Search movies"><span class="material-symbols-rounded" aria-hidden="true">search</span></a>
    </nav>
    <div class="ambient ambient-one" aria-hidden="true"></div>
    <div class="ambient ambient-two" aria-hidden="true"></div>
    <main class="movie-search-page movie-details-page">
        <div class="subpage-film-strip" aria-hidden="true"><div class="strip-item"><span class="material-symbols-rounded strip-icon">movie</span><span>SCENE: DETAILS</span></div><div class="strip-item strip-highlight"><span>INDIAN CINEMA · MOVIE PROFILE</span></div></div>
        <header class="movie-search-header">
            <button type="button" id="backToSearchBtn" class="back-to-search-btn"><span class="material-symbols-rounded back-btn-icon" aria-hidden="true">arrow_back</span><span>Back to Search</span></button>
            <button class="theme-toggle" type="button" data-theme-toggle aria-label="Switch to dark mode" title="Switch to dark mode" aria-pressed="false"><span class="material-symbols-rounded" aria-hidden="true">dark_mode</span></button>
            <div class="movie-search-brand"><span class="brand-sub-badge">03 / DETAILS</span><span class="brand-text">MOVIE<span class="brand-ai-accent">AI</span></span></div>
        </header>
        <section id="movieDetailsContent" class="movie-details-page-view" aria-live="polite" aria-busy="true"></section>
    </main>
    <script src="theme.js"></script>
    <script src="movie-details.js"></script>
</body>
</html>
